# Nur lesen: zeigt den Stand des Adventskalenders in Firestore (Actions › Prüfung › Run workflow)
name: Prüfung
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock --silent firebase-admin@12
      - run: node scripts/pruefung.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
